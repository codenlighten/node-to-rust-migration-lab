[package]
name = "backend-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.17"
jsonwebtoken = "9"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tower = { version = "0.5", features = ["util"] }
form_urlencoded = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
