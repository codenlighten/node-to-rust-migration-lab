name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Node unit tests (shared validation vectors)
        working-directory: backend-node
        run: npm ci && npm test
      - name: Rust unit tests (same shared vectors)
        working-directory: backend-rust
        run: cargo test --locked
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck and build the dashboard
        working-directory: frontend
        run: npm ci && npm run build
  verify-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and run migration verification (contract + concurrency)
        run: make verify-migration
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: migration-reports, path: migration-tests/report/ }
