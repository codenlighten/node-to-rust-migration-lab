server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
  location /__gateway/ { proxy_pass http://gateway:8080; }
  location /reports/ { alias /usr/share/nginx/html/reports/; add_header Cache-Control no-store; }
  location /benchmarks/ { alias /usr/share/nginx/html/benchmarks/; add_header Cache-Control no-store; }
  location / { try_files $uri /index.html; }
}
